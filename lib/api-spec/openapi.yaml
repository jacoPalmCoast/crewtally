openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CrewTally API
servers:
  - url: /api
    description: Replit API proxy prefix
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
  - name: account
    description: Authenticated account operations
paths:
  /v1/health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      tags: [auth]
      summary: Verify Apple sign-in and create a session
      description: Verifies the Apple identity token and issues an opaque CrewTally session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignInRequest"
      responses:
        "200":
          description: Session created
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleSignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/auth/dev:
    post:
      operationId: signInDev
      tags: [auth]
      summary: Sign in as a configured development owner
      description: Available only when APP_ENV is development and DEV_SIGNIN_CODE is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevSignInInput"
      responses:
        "200":
          description: Session created
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleSignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/auth/signout:
    post:
      operationId: signOut
      tags: [auth]
      summary: Revoke the caller's session
      description: Revokes only the session associated with the presented bearer token.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the authenticated account and its active workspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateAccountName
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountNameInput" }
      responses:
        "200":
          description: Updated name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NameResult" }
  /v1/config:
    get:
      operationId: getConfig
      responses:
        "200":
          description: Public feature flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }
  /v1/workspaces:
    post:
      operationId: createWorkspace
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "200": &workspaceResponse
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /v1/workspace:
    parameters: &workspaceParameters
      - { $ref: "#/components/parameters/WorkspaceHeader" }
    get:
      operationId: getWorkspace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workspace and current member permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceAccess" }
    patch:
      operationId: renameWorkspace
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceNameInput" }
      responses:
        "200": *workspaceResponse
  /v1/members:
    parameters: *workspaceParameters
    get:
      operationId: listMembers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active members; emails only with members.manage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
  /v1/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceHeader" }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeMember
      security: [{ bearerAuth: [] }]
      requestBody: &operationBody
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationInput" }
      responses:
        "200": &okResponse
          description: Operation completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }
    patch:
      operationId: changeMemberRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleInput" }
      responses:
        "200": *okResponse
  /v1/invitations:
    parameters: *workspaceParameters
    get:
      operationId: listInvitations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pending and recent invitations; never raw credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
    post:
      operationId: createInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "200":
          description: Credentials returned once; replay returns null credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
  /v1/invitations/{id}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceHeader" }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvitation
      security: [{ bearerAuth: [] }]
      requestBody: *operationBody
      responses:
        "200": *okResponse
  /v1/invite/peek:
    post:
      operationId: peekInvitation
      requestBody: &tokenBody
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenInput" }
      responses:
        "200":
          description: Workspace name and role only, or unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
  /v1/invite/accept:
    post:
      operationId: acceptInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptInput" }
      responses:
        "200": &joinedResponse
          description: Membership created or reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationAccepted" }
        "410":
          description: Invitation not available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/invite/accept-code:
    post:
      operationId: acceptInvitationCode
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCodeInput" }
      responses:
        "200": *joinedResponse
        "400":
          description: Wrong, expired or rate-exhausted code; one opaque answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/invite/decline:
    post:
      operationId: declineInvitation
      requestBody: *tokenBody
      responses:
        "200": *okResponse
        "429":
          description: More than 20 invitation decline requests per client IP in one minute
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/projects:
    parameters: *workspaceParameters
    get:
      operationId: listProjects
      security: [{ bearerAuth: [] }]
      responses:
        "200": &projectsResponse
          description: Active projects
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "409": &domainConflict { $ref: "#/components/responses/DomainConflict" }
        "422": &domainInvalid { $ref: "#/components/responses/DomainInvalid" }
        default: &domainError { $ref: "#/components/responses/DomainError" }
    post:
      operationId: createProject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200": &projectResponse
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/projects/{id}:
    parameters: &domainIdParameters
      - { $ref: "#/components/parameters/WorkspaceHeader" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProject
      security: [{ bearerAuth: [] }]
      responses: { "200": *projectResponse, "409": *domainConflict, "422": *domainInvalid, default: *domainError }
    patch:
      operationId: updateProject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdateInput" }
      responses: { "200": *projectResponse, "409": *domainConflict, "422": *domainInvalid, default: *domainError }
  /v1/workers:
    parameters: *workspaceParameters
    get:
      operationId: listWorkers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active workers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Worker" } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
    post:
      operationId: createWorker
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerInput" }
      responses:
        "200": &workerResponse
          description: Worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/workers/{id}:
    parameters: *domainIdParameters
    get:
      operationId: getWorker
      security: [{ bearerAuth: [] }]
      responses: { "200": *workerResponse, "409": *domainConflict, "422": *domainInvalid, default: *domainError }
    patch:
      operationId: updateWorker
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerUpdateInput" }
      responses: { "200": *workerResponse, "409": *domainConflict, "422": *domainInvalid, default: *domainError }
  /v1/workers/{id}/year-paid:
    parameters: *domainIdParameters
    get:
      operationId: getWorkerYearPaid
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Net paid by year
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [year, net_paid_minor]
                  properties:
                    year: { type: integer }
                    net_paid_minor: { type: integer }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/projects/{id}/assignments:
    parameters: *domainIdParameters
    get:
      operationId: listAssignments
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Project assignments with worker display names
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
    post:
      operationId: createAssignment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentInput" }
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/assignments/{id}:
    parameters: *domainIdParameters
    delete:
      operationId: removeAssignment
      security: [{ bearerAuth: [] }]
      requestBody: *operationBody
      responses: { "200": *okResponse, "409": *domainConflict, "422": *domainInvalid, default: *domainError }
  /v1/assignments/{id}/rates:
    parameters: *domainIdParameters
    get:
      operationId: listRates
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Effective dated rates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RateAgreement" } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
    post:
      operationId: applyRateChange
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateChangeInput" }
      responses:
        "200":
          description: Rate applied
          content:
            application/json:
              schema:
                type: object
                required: [agreement_id, corrected_days, total_delta_minor]
                properties:
                  agreement_id: { type: string, format: uuid }
                  corrected_days: { type: integer }
                  total_delta_minor: { type: integer }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/assignments/{id}/rates/preview:
    parameters: *domainIdParameters
    post:
      operationId: previewRateChange
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatePreviewInput" }
      responses:
        "200":
          description: Read-only rate change preview
          content:
            application/json:
              schema:
                type: object
                required: [affected, total_delta_minor, blocked_reason]
                properties:
                  affected:
                    type: array
                    items:
                      type: object
                      required: [work_date, old_earned_minor, new_earned_minor, delta_minor]
                      properties:
                        work_date: { type: string }
                        old_earned_minor: { type: integer }
                        new_earned_minor: { type: integer }
                        delta_minor: { type: integer }
                  total_delta_minor: { type: integer }
                  blocked_reason: { type: [string, "null"] }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/work-entries:
    parameters: *workspaceParameters
    get:
      operationId: listWorkEntries
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: assignment_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/DomainDate" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/DomainDate" } }
      responses:
        "200":
          description: Active work revisions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkEntry" } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
    post:
      operationId: recordWork
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkInput" }
      responses:
        "200":
          description: Recorded work
          content:
            application/json:
              schema:
                type: object
                required: [entry_id, version, revision, earned_minor, delta_minor]
                properties:
                  entry_id: { type: string, format: uuid }
                  version: { type: integer }
                  revision: { type: integer }
                  earned_minor: { type: integer }
                  delta_minor: { type: integer }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/work-entries/no-work:
    parameters: *workspaceParameters
    post:
      operationId: markRestNoWork
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoWorkInput" }
      responses:
        "200":
          description: Marked remaining unrecorded assignments
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties: { marked: { type: integer } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/payments:
    parameters: *workspaceParameters
    get:
      operationId: listPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { $ref: "#/components/schemas/DomainDate" } }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/DomainDate" } }
        - { name: worker_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Payments including all allocations for matching payments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
    post:
      operationId: recordPayment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "200": &paymentResultResponse
          description: Recorded payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResult" }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/payments/{id}/reverse:
    parameters: *domainIdParameters
    post:
      operationId: reversePayment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReversalInput" }
      responses:
        "200": &reversalResultResponse
          description: Reversed payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReversalResult" }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/payments/{id}/clearance:
    parameters: *domainIdParameters
    patch:
      operationId: clearPayment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearanceInput" }
      responses:
        "200":
          description: Check cleared
          content:
            application/json:
              schema:
                type: object
                required: [payment_version, clearance]
                properties: { payment_version: { type: integer }, clearance: { type: string, enum: [CLEARED] } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/payments/{id}/correct:
    parameters: *domainIdParameters
    post:
      operationId: correctPayment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCorrectionInput" }
      responses:
        "200":
          description: Atomic reversal and replacement
          content:
            application/json:
              schema:
                type: object
                required: [replaced_payment_id, reversal, payment]
                properties:
                  replaced_payment_id: { type: string, format: uuid }
                  reversal: { $ref: "#/components/schemas/ReversalResult" }
                  payment: { $ref: "#/components/schemas/PaymentResult" }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/balances:
    parameters: *workspaceParameters
    get:
      operationId: listBalances
      security: [{ bearerAuth: [] }]
      parameters: &ledgerFilters
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: worker_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authoritative assignment balances
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [assignment_id, project_id, worker_id, balance_minor]
                  properties:
                    assignment_id: { type: string, format: uuid }
                    project_id: { type: string, format: uuid }
                    worker_id: { type: string, format: uuid }
                    balance_minor: { type: integer }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/history:
    parameters: *workspaceParameters
    get:
      operationId: listHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: worker_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { $ref: "#/components/schemas/DomainDate" } }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/DomainDate" } }
      responses:
        "200":
          description: Append-only ledger history ordered by sequence
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [effective_date, event_type, signed_delta, source_type, source_id, seq]
                  properties:
                    effective_date: { type: string }
                    event_type: { type: string, enum: [EARNING, EARNING_CORRECTION, REIMBURSEMENT, ADJUSTMENT, PAYMENT, PAYMENT_REVERSAL] }
                    signed_delta: { type: integer }
                    source_type: { type: string }
                    source_id: { type: string, format: uuid }
                    seq: { type: integer }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/reimbursements:
    parameters: *workspaceParameters
    post:
      operationId: recordReimbursement
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReimbursementInput" }
      responses:
        "200":
          description: Reimbursement recorded
          content:
            application/json:
              schema:
                type: object
                required: [reimbursement_id]
                properties: { reimbursement_id: { type: string, format: uuid } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
  /v1/adjustments:
    parameters: *workspaceParameters
    post:
      operationId: recordAdjustment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustmentInput" }
      responses:
        "200":
          description: Adjustment recorded
          content:
            application/json:
              schema:
                type: object
                required: [adjustment_id]
                properties: { adjustment_id: { type: string, format: uuid } }
        "409": *domainConflict
        "422": *domainInvalid
        default: *domainError
components:
  parameters:
    WorkspaceHeader:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    DomainDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Valid calendar date in YYYY-MM-DD format
    DomainAmount:
      type: integer
      minimum: 1
      maximum: 10000000
      description: Integer cents, never a floating-point money amount
    ProjectInput:
      type: object
      required: [operation_id, name, timezone]
      additionalProperties: false
      properties:
        operation_id: &domainOperation { type: string, format: uuid }
        name: &projectName { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        work_days: &workDays { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 7 } }
        address: &optionalText { type: [string, "null"], maxLength: 500 }
    ProjectUpdateInput:
      type: object
      required: [operation_id]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        name: *projectName
        address: *optionalText
        work_days: *workDays
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
    Project:
      type: object
      required: [id, name, address, timezone, work_days, status, version]
      properties:
        id: *domainOperation
        name: *projectName
        address: *optionalText
        timezone: { type: string }
        work_days: *workDays
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        version: { type: integer }
    WorkerInput:
      type: object
      required: [operation_id, display_name]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        display_name: &workerName { type: string, minLength: 1, maxLength: 60 }
        phone: &workerPhone { type: [string, "null"], maxLength: 60 }
        email: &workerEmail { type: [string, "null"], format: email, maxLength: 254 }
        document_language: &documentLanguage { type: string, enum: [en, es] }
    WorkerUpdateInput:
      type: object
      required: [operation_id]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        display_name: *workerName
        phone: *workerPhone
        email: *workerEmail
        document_language: *documentLanguage
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    Worker:
      type: object
      required: [id, display_name, phone, email, document_language, status, version]
      properties:
        id: *domainOperation
        display_name: *workerName
        phone: *workerPhone
        email: *workerEmail
        document_language: *documentLanguage
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer }
    AssignmentInput:
      type: object
      required: [operation_id, worker_id, start_date]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        worker_id: *domainOperation
        start_date: { $ref: "#/components/schemas/DomainDate" }
        end_date: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
    Assignment:
      type: object
      required: [id, project_id, worker_id, start_date, end_date, version]
      properties:
        id: *domainOperation
        project_id: *domainOperation
        worker_id: *domainOperation
        start_date: { type: string }
        end_date: { type: [string, "null"] }
        version: { type: integer }
        display_name: *workerName
    RatePreviewInput:
      type: object
      required: [effective_from, pay_basis, rate_minor]
      additionalProperties: false
      properties: &rateFields
        effective_from: { $ref: "#/components/schemas/DomainDate" }
        pay_basis: { type: string, enum: [DAY, HOUR] }
        rate_minor: { type: integer, minimum: 1, maximum: 500000 }
        standard_day_minutes: { type: [integer, "null"], minimum: 60, maximum: 1440 }
    RateChangeInput:
      type: object
      required: [operation_id, effective_from, pay_basis, rate_minor]
      additionalProperties: false
      properties:
        effective_from: { $ref: "#/components/schemas/DomainDate" }
        pay_basis: { type: string, enum: [DAY, HOUR] }
        rate_minor: { type: integer, minimum: 1, maximum: 500000 }
        standard_day_minutes: { type: [integer, "null"], minimum: 60, maximum: 1440 }
        operation_id: *domainOperation
        reason: *optionalText
        confirm: { type: boolean }
    RateAgreement:
      type: object
      required: [id, effective_from, pay_basis, rate_minor, standard_day_minutes]
      properties:
        effective_from: { $ref: "#/components/schemas/DomainDate" }
        pay_basis: { type: string, enum: [DAY, HOUR] }
        rate_minor: { type: integer, minimum: 1, maximum: 500000 }
        standard_day_minutes: { type: [integer, "null"], minimum: 60, maximum: 1440 }
        id: *domainOperation
    WorkInput:
      type: object
      required: [operation_id, assignment_id, date, mode, expected_version]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        assignment_id: *domainOperation
        date: { $ref: "#/components/schemas/DomainDate" }
        mode: &workMode { type: string, enum: [DAY_PORTION, DAY_MINUTES, HOUR_MINUTES, NO_WORK, VOID] }
        portion: &portion { type: [string, "null"], pattern: '^(1(?:\.0{1,4})?|0\.\d{1,4})$' }
        minutes: &minutes { type: [integer, "null"], minimum: 1, maximum: 1440 }
        expected_version: &expectedVersion { type: integer, minimum: 0, maximum: 2147483647 }
        reason: *optionalText
        note: *optionalText
    WorkEntry:
      type: object
      required: [work_date, version, input_mode, portion, minutes, earned_minor]
      properties:
        work_date: { type: string }
        version: { type: integer }
        input_mode: *workMode
        portion: *portion
        minutes: *minutes
        earned_minor: { type: integer }
    NoWorkInput:
      type: object
      required: [operation_id, project_id, date]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        project_id: *domainOperation
        date: { $ref: "#/components/schemas/DomainDate" }
    AllocationInput:
      type: object
      required: [assignment_id, amount_minor]
      additionalProperties: false
      properties:
        assignment_id: *domainOperation
        amount_minor: { $ref: "#/components/schemas/DomainAmount" }
    PaymentInput:
      type: object
      required: [operation_id, date, method, amount_minor, recipient, allocations]
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/DomainDate" }
        method: &paymentMethod { type: string, enum: [CASH, CHECK, BANK_TRANSFER, ZELLE, OTHER] }
        method_note: *optionalText
        amount_minor: { $ref: "#/components/schemas/DomainAmount" }
        recipient: { type: string, minLength: 1, maxLength: 80 }
        reference: *optionalText
        allocations: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AllocationInput" } }
        operation_id: *domainOperation
        note: *optionalText
    PaymentCorrectionInput:
      type: object
      required: [operation_id, expected_version, effective_date, reason, date, method, amount_minor, recipient, allocations]
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/DomainDate" }
        method: *paymentMethod
        method_note: *optionalText
        amount_minor: { $ref: "#/components/schemas/DomainAmount" }
        recipient: { type: string, minLength: 1, maxLength: 80 }
        reference: *optionalText
        allocations: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AllocationInput" } }
        operation_id: *domainOperation
        expected_version: *expectedVersion
        effective_date: { $ref: "#/components/schemas/DomainDate" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Payment:
      type: object
      required: [id, receipt_no, payment_date, method, method_note, amount_minor, recipient_label, reference, note, clearance, replaces_payment_id, version, allocations]
      properties:
        id: *domainOperation
        receipt_no: { type: integer }
        payment_date: { type: string }
        method: *paymentMethod
        method_note: *optionalText
        amount_minor: { type: integer }
        recipient_label: { type: string }
        reference: *optionalText
        note: *optionalText
        clearance: { type: [string, "null"], enum: [ISSUED, CLEARED, RETURNED, null] }
        replaces_payment_id: { type: [string, "null"], format: uuid }
        version: { type: integer }
        allocations:
          type: array
          items:
            type: object
            required: [id, assignment_id, amount_minor]
            properties:
              id: *domainOperation
              assignment_id: *domainOperation
              amount_minor: { type: integer }
    PaymentResult:
      type: object
      required: [payment_id, receipt_no, version]
      properties:
        payment_id: *domainOperation
        receipt_no: { type: integer }
        version: { type: integer }
    ReversalInput:
      type: object
      required: [operation_id, kind, reason, expected_version, effective_date]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        kind: { type: string, enum: [FULL, PARTIAL, CHECK_RETURNED, CORRECTION] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expected_version: *expectedVersion
        effective_date: { $ref: "#/components/schemas/DomainDate" }
        lines:
          type: [array, "null"]
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [allocation_id, amount_minor]
            properties:
              allocation_id: *domainOperation
              amount_minor: { $ref: "#/components/schemas/DomainAmount" }
    ReversalResult:
      type: object
      required: [reversal_id, payment_version, reversed_minor, unreversed_minor]
      properties:
        reversal_id: *domainOperation
        payment_version: { type: integer }
        reversed_minor: { type: integer }
        unreversed_minor: { type: integer }
    ClearanceInput:
      type: object
      required: [operation_id, expected_version]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        expected_version: *expectedVersion
    ReimbursementInput:
      type: object
      required: [operation_id, assignment_id, date, amount_minor, description]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        assignment_id: *domainOperation
        date: { $ref: "#/components/schemas/DomainDate" }
        amount_minor: { type: integer, minimum: 1, maximum: 5000000 }
        description: { type: string, minLength: 1, maxLength: 500 }
    AdjustmentInput:
      type: object
      required: [operation_id, assignment_id, date, direction, category, amount_minor, reason]
      additionalProperties: false
      properties:
        operation_id: *domainOperation
        assignment_id: *domainOperation
        date: { $ref: "#/components/schemas/DomainDate" }
        direction: { type: string, enum: [INCREASE_OWED, DECREASE_OWED] }
        category: { type: string, enum: [OPENING_BALANCE, BONUS, OVERTIME, DEDUCTION, OTHER] }
        amount_minor: { $ref: "#/components/schemas/DomainAmount" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PublicConfig:
      type: object
      required: [business_enabled]
      properties:
        business_enabled: { type: boolean }
      additionalProperties: false
    OperationInput:
      type: object
      required: [operation_id]
      properties:
        operation_id: { type: string, format: uuid }
      additionalProperties: false
    WorkspaceInput:
      type: object
      required: [operation_id, kind, name, timezone]
      properties:
        operation_id: { type: string, format: uuid }
        kind: { type: string, enum: [HOME, BUSINESS] }
        name: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false
    WorkspaceNameInput:
      type: object
      required: [operation_id, name]
      properties:
        operation_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
      additionalProperties: false
    AccountNameInput:
      type: object
      required: [operation_id, display_name]
      properties:
        operation_id: { type: string, format: uuid }
        display_name: { type: string, maxLength: 60 }
      additionalProperties: false
    NameResult:
      type: object
      required: [display_name]
      properties:
        display_name: { type: [string, "null"] }
    OkResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    WorkspaceAccess:
      allOf:
        - { $ref: "#/components/schemas/Workspace" }
        - type: object
          required: [role, financial_access, worker_id, can]
          properties:
            role: { type: string }
            financial_access: { type: [boolean, "null"] }
            worker_id: { type: [string, "null"], format: uuid }
            can:
              type: object
              additionalProperties: { type: boolean }
    MemberRoleInput:
      type: object
      required: [operation_id, role]
      properties:
        operation_id: { type: string, format: uuid }
        role: { type: string, enum: [ORGANIZER, PARTNER, OWNER, ADMIN, LEAD, WORKER] }
        financial_access: { type: [boolean, "null"] }
      additionalProperties: false
    Member:
      type: object
      required: [user_id, display_name, name, role, financial_access, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        name: { type: string }
        role: { type: string }
        financial_access: { type: [boolean, "null"] }
        joined_at: { type: string, format: date-time }
        email: { type: [string, "null"] }
    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    InvitationInput:
      type: object
      required: [operation_id, role, email]
      properties:
        operation_id: { type: string, format: uuid }
        role: { type: string, enum: [PARTNER, ADMIN, LEAD, WORKER] }
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, maxLength: 60 }
        financial_access: { type: [boolean, "null"] }
        worker_id: { type: [string, "null"], format: uuid }
      additionalProperties: false
    Invitation:
      type: object
      required: [id, invitee_name, email, role, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        invitee_name: { type: [string, "null"] }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, REVOKED, DECLINED, EXPIRED] }
        expires_at: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
    InvitationCreated:
      type: object
      required: [id, expires_at, token, code, link, already_created]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        token: { type: [string, "null"] }
        code: { type: [string, "null"] }
        link: { type: [string, "null"] }
        already_created: { type: boolean }
    InvitationTokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      additionalProperties: false
    InvitationAcceptInput:
      type: object
      required: [token, operation_id]
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        operation_id: { type: string, format: uuid }
      additionalProperties: false
    InvitationCodeInput:
      type: object
      required: [email, code, operation_id]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$" }
        operation_id: { type: string, format: uuid }
      additionalProperties: false
    InvitationPreview:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        workspace_name: { type: string }
        role: { type: string }
    InvitationAccepted:
      type: object
      required: [workspace_id, role, already_member]
      properties:
        workspace_id: { type: string, format: uuid }
        role: { type: string }
        already_member: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          const: ok
        migrations:
          type: integer
          minimum: 0
      required: [status, db, migrations]
      additionalProperties: false
    AppleSignInRequest:
      type: object
      properties:
        identityToken:
          type: string
          minLength: 1
          maxLength: 16384
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 4096
        rawNonce:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
      required: [identityToken, authorizationCode, rawNonce]
      additionalProperties: false
    DevSignInInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 4096
        label:
          type: string
          enum: [owner-a, owner-b, member-c, member-d]
      required: [code, label]
      additionalProperties: false
    AppleSignInResponse:
      type: object
      properties:
        sessionToken:
          type: string
          minLength: 43
          maxLength: 43
        user:
          $ref: "#/components/schemas/User"
      required: [sessionToken, user]
      additionalProperties: false
    MeResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
        user:
          $ref: "#/components/schemas/AccountUser"
      required: [workspaces, user]
      additionalProperties: false
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          const: USD
        kind:
          type: string
          enum: [HOME, BUSINESS]
        default_timezone:
          type: [string, "null"]
      required: [id, name, currency, kind, default_timezone]
    WorkspaceSummary:
      type: object
      required: [id, name, kind, role, financial_access]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [HOME, BUSINESS] }
        role: { type: string }
        financial_access: { type: [boolean, "null"] }
    AccountUser:
      type: object
      required: [id, display_name, email, has_apple]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        has_apple: { type: boolean }
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required: [id]
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
              format: uuid
          required: [code, message, correlationId]
          additionalProperties: false
      required: [error]
      additionalProperties: false
  responses:
    DomainConflict:
      description: Stale version, operation reused, duplicate record, or CONFIRMATION_REQUIRED (resubmit with confirm true)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DomainInvalid:
      description: Domain business rule failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DomainError:
      description: >-
        Standard error envelope (400 validation, 401 session, 403 permission,
        404 missing, foreign or excluded-role resource, 500 internal error).
        All S1 domain routes retain existing HOME permissions. Interim BUSINESS
        access requires OWNER, or ADMIN with financial_access=true; other
        BUSINESS roles receive 404 before domain action or schema validation.
        Business job/worker scoping is deferred to its own phase. Identity and
        membership routes retain their existing permissions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Malformed or invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid identity or session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Development sign-in is not enabled in this environment
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many authentication requests from this IP
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Safe server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"